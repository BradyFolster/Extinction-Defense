name: Build Portable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.1.0"
        required: true
        type: string

      publish_release:
        description: "Publish as a GitHub Release"
        required: true
        default: true
        type: boolean


env:
  VCPKG_COMMIT: f007e903c40c3c2731211c1691a0b115faba224e


jobs:

  # ==========================================================================
  # Validate version
  # ==========================================================================

  validate:
    name: Validate version
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          # Allow either:
          #   0.1.0
          # or:
          #   v0.1.0
          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $VERSION"
              echo ""
              echo "Use a version such as:"
              echo "    0.1.0"
              echo "    0.1.1"
              echo "    1.0.0"
              exit 1
          fi

          echo "Validated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make sure release tag does not already exist
        if: ${{ inputs.publish_release }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists."
              echo "Choose a new version number."
              exit 1
          fi


  # ==========================================================================
  # Windows x64
  # ==========================================================================

  windows:
    name: Windows x64
    needs: validate

    runs-on: windows-2022

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show build tools
        shell: pwsh
        run: |
          cmake --version
          git --version

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"

          git init $vcpkgRoot

          git -C $vcpkgRoot remote add origin `
              https://github.com/microsoft/vcpkg.git

          git -C $vcpkgRoot fetch `
              --depth 1 `
              origin `
              $env:VCPKG_COMMIT

          git -C $vcpkgRoot checkout FETCH_HEAD

          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cmake `
              -S . `
              -B build/windows `
              -G "Visual Studio 17 2022" `
              -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
              -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/triplets" `
              -DEXTINCTION_DEFENSE_VERSION="$env:VERSION" `
              -DEXTINCTION_DEFENSE_BUILD_TOOLS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake `
              --build build/windows `
              --config Release `
              --parallel `
              --target ExtinctionDefense

      - name: Package Windows ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $packageName = "ExtinctionDefense-v$env:VERSION-Windows-x64"
          $packageDirectory = "dist\$packageName"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $packageDirectory

          $exeCandidates = @(
              "build\windows\Release\ExtinctionDefense.exe",
              "build\windows\ExtinctionDefense.exe"
          )

          $exePath = $null

          foreach ($candidate in $exeCandidates) {
              if (Test-Path $candidate) {
                  $exePath = $candidate
                  break
              }
          }

          if ($null -eq $exePath) {
              Write-Error "Could not find ExtinctionDefense.exe"
              Get-ChildItem build\windows -Recurse
              exit 1
          }

          Copy-Item `
              $exePath `
              "$packageDirectory\ExtinctionDefense.exe"

          Copy-Item `
              "assets" `
              "$packageDirectory\assets" `
              -Recurse

          if (Test-Path "settings.json") {
              Copy-Item `
                  "settings.json" `
                  "$packageDirectory\settings.json"
          }

          Compress-Archive `
              -Path "$packageDirectory\*" `
              -DestinationPath "dist\$packageName.zip" `
              -CompressionLevel Optimal

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/ExtinctionDefense-v${{ needs.validate.outputs.version }}-Windows-x64.zip
          if-no-files-found: error


  # ==========================================================================
  # Linux x64
  # ==========================================================================

  linux:
    name: Linux x64
    needs: validate

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build requirements
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
              build-essential \
              cmake \
              git \
              curl \
              zip \
              unzip \
              ninja-build \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              libtool \
              libx11-dev \
              libxft-dev \
              libxext-dev \
              libwayland-dev \
              libxkbcommon-dev \
              libegl1-mesa-dev \
              libibus-1.0-dev

      - name: Show build tools
        shell: bash
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version
          git --version
          autoconf --version
          automake --version
          libtoolize --version

      - name: Install pinned vcpkg
        shell: bash
        run: |
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"

          git init "$VCPKG_ROOT"

          git -C "$VCPKG_ROOT" remote add origin \
              https://github.com/microsoft/vcpkg.git

          git -C "$VCPKG_ROOT" fetch \
              --depth 1 \
              origin \
              "$VCPKG_COMMIT"

          git -C "$VCPKG_ROOT" checkout FETCH_HEAD

          "$VCPKG_ROOT/bootstrap-vcpkg.sh" \
              -disableMetrics

          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cmake \
              -S . \
              -B build/linux \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-linux-release \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets" \
              -DEXTINCTION_DEFENSE_VERSION="$VERSION" \
              -DEXTINCTION_DEFENSE_BUILD_TOOLS=OFF

      - name: Build
        shell: bash
        run: |
          cmake \
              --build build/linux \
              --parallel \
              --target ExtinctionDefense

      - name: Show linked libraries
        shell: bash
        run: |
          echo "Linked runtime libraries:"
          ldd build/linux/ExtinctionDefense || true

      - name: Package Linux ZIP
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PACKAGE_NAME="ExtinctionDefense-v${VERSION}-Linux-x64"
          PACKAGE_DIRECTORY="dist/${PACKAGE_NAME}"

          mkdir -p "$PACKAGE_DIRECTORY"

          if [[ ! -f build/linux/ExtinctionDefense ]]; then
              echo "Could not find Linux executable."
              find build/linux -maxdepth 4 -type f -print
              exit 1
          fi

          cp \
              build/linux/ExtinctionDefense \
              "$PACKAGE_DIRECTORY/ExtinctionDefense"

          chmod +x \
              "$PACKAGE_DIRECTORY/ExtinctionDefense"

          cp -R \
              assets \
              "$PACKAGE_DIRECTORY/assets"

          if [[ -f settings.json ]]; then
              cp \
                  settings.json \
                  "$PACKAGE_DIRECTORY/settings.json"
          fi

          cd dist

          zip \
              -r \
              "${PACKAGE_NAME}.zip" \
              "${PACKAGE_NAME}"

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/ExtinctionDefense-v${{ needs.validate.outputs.version }}-Linux-x64.zip
          if-no-files-found: error


  # ==========================================================================
  # macOS Intel
  # ==========================================================================

  macos-intel:
    name: macOS Intel
    needs: validate

    runs-on: macos-15-intel

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install macOS build requirements
        shell: bash
        run: |
          brew update

          brew install \
              ninja \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              libtool

      - name: Show build tools
        shell: bash
        run: |
          cmake --version
          ninja --version
          clang --version
          git --version
          autoconf --version
          automake --version

      - name: Install pinned vcpkg
        shell: bash
        run: |
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"

          git init "$VCPKG_ROOT"

          git -C "$VCPKG_ROOT" remote add origin \
              https://github.com/microsoft/vcpkg.git

          git -C "$VCPKG_ROOT" fetch \
              --depth 1 \
              origin \
              "$VCPKG_COMMIT"

          git -C "$VCPKG_ROOT" checkout FETCH_HEAD

          "$VCPKG_ROOT/bootstrap-vcpkg.sh" \
              -disableMetrics

          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cmake \
              -S . \
              -B build/macos-intel \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-osx-release \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets" \
              -DEXTINCTION_DEFENSE_VERSION="$VERSION" \
              -DEXTINCTION_DEFENSE_BUILD_TOOLS=OFF

      - name: Build
        shell: bash
        run: |
          cmake \
              --build build/macos-intel \
              --parallel \
              --target ExtinctionDefense

      - name: Verify Intel architecture
        shell: bash
        run: |
          file build/macos-intel/ExtinctionDefense
          lipo -info build/macos-intel/ExtinctionDefense

      - name: Upload Intel executable
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-binary
          path: build/macos-intel/ExtinctionDefense
          if-no-files-found: error
          retention-days: 1


  # ==========================================================================
  # macOS Apple Silicon
  # ==========================================================================

  macos-arm:
    name: macOS Apple Silicon
    needs: validate

    runs-on: macos-15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install macOS build requirements
        shell: bash
        run: |
          brew update

          brew install \
              ninja \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              libtool

      - name: Show build tools
        shell: bash
        run: |
          cmake --version
          ninja --version
          clang --version
          git --version
          autoconf --version
          automake --version

      - name: Install pinned vcpkg
        shell: bash
        run: |
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"

          git init "$VCPKG_ROOT"

          git -C "$VCPKG_ROOT" remote add origin \
              https://github.com/microsoft/vcpkg.git

          git -C "$VCPKG_ROOT" fetch \
              --depth 1 \
              origin \
              "$VCPKG_COMMIT"

          git -C "$VCPKG_ROOT" checkout FETCH_HEAD

          "$VCPKG_ROOT/bootstrap-vcpkg.sh" \
              -disableMetrics

          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cmake \
              -S . \
              -B build/macos-arm \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=arm64-osx-release \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets" \
              -DEXTINCTION_DEFENSE_VERSION="$VERSION" \
              -DEXTINCTION_DEFENSE_BUILD_TOOLS=OFF

      - name: Build
        shell: bash
        run: |
          cmake \
              --build build/macos-arm \
              --parallel \
              --target ExtinctionDefense

      - name: Verify Apple Silicon architecture
        shell: bash
        run: |
          file build/macos-arm/ExtinctionDefense
          lipo -info build/macos-arm/ExtinctionDefense

      - name: Upload Apple Silicon executable
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm-binary
          path: build/macos-arm/ExtinctionDefense
          if-no-files-found: error
          retention-days: 1


  # ==========================================================================
  # Combine macOS builds into one Universal app
  # ==========================================================================

  macos-universal:
    name: macOS Universal
    needs:
      - validate
      - macos-intel
      - macos-arm

    runs-on: macos-15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Intel executable
        uses: actions/download-artifact@v8
        with:
          name: macos-intel-binary
          path: macos-intel

      - name: Download Apple Silicon executable
        uses: actions/download-artifact@v8
        with:
          name: macos-arm-binary
          path: macos-arm

      - name: Create macOS app icon
        shell: bash
        run: |
          mkdir -p AppIcon.iconset

          sips -z 16 16 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_16x16.png

          sips -z 32 32 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_16x16@2x.png

          sips -z 32 32 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_32x32.png

          sips -z 64 64 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_32x32@2x.png

          sips -z 128 128 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_128x128.png

          sips -z 256 256 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_128x128@2x.png

          sips -z 256 256 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_256x256.png

          sips -z 512 512 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_256x256@2x.png

          sips -z 512 512 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_512x512.png

          sips -z 1024 1024 \
              assets/images/icon.png \
              --out AppIcon.iconset/icon_512x512@2x.png

          iconutil \
              -c icns \
              AppIcon.iconset \
              -o ExtinctionDefense.icns

      - name: Create Universal macOS app
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          APP="dist/Extinction Defense.app"

          mkdir -p \
              "$APP/Contents/MacOS"

          mkdir -p \
              "$APP/Contents/Resources"

          cp \
              ExtinctionDefense.icns \
              "$APP/Contents/Resources/ExtinctionDefense.icns"

          INTEL_BINARY="macos-intel/ExtinctionDefense"
          ARM_BINARY="macos-arm/ExtinctionDefense"

          if [[ ! -f "$INTEL_BINARY" ]]; then
              echo "Intel executable not found."
              find macos-intel -type f -print
              exit 1
          fi

          if [[ ! -f "$ARM_BINARY" ]]; then
              echo "Apple Silicon executable not found."
              find macos-arm -type f -print
              exit 1
          fi

          lipo \
              -create \
              "$INTEL_BINARY" \
              "$ARM_BINARY" \
              -output \
              "$APP/Contents/MacOS/ExtinctionDefense"

          chmod +x \
              "$APP/Contents/MacOS/ExtinctionDefense"

          cp -R \
              assets \
              "$APP/Contents/Resources/assets"

          if [[ -f settings.json ]]; then
              cp \
                  settings.json \
                  "$APP/Contents/Resources/settings.json"
          fi

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleDisplayName</key>
              <string>Extinction Defense</string>

              <key>CFBundleExecutable</key>
              <string>ExtinctionDefense</string>

              <key>CFBundleIconFile</key>
              <string>ExtinctionDefense</string>

              <key>CFBundleIdentifier</key>
              <string>com.bradyfolster.extinctiondefense</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>Extinction Defense</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>

              <key>CFBundleVersion</key>
              <string>${VERSION}</string>

              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>

              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Verify Universal executable
        shell: bash
        run: |
          file \
              "dist/Extinction Defense.app/Contents/MacOS/ExtinctionDefense"

          lipo \
              -info \
              "dist/Extinction Defense.app/Contents/MacOS/ExtinctionDefense"

          plutil \
              -lint \
              "dist/Extinction Defense.app/Contents/Info.plist"

      - name: Package macOS ZIP
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist

          ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              "Extinction Defense.app" \
              "ExtinctionDefense-v${VERSION}-macOS-Universal.zip"

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/ExtinctionDefense-v${{ needs.validate.outputs.version }}-macOS-Universal.zip
          if-no-files-found: error


  # ==========================================================================
  # Optional GitHub Release
  # ==========================================================================

  release:
    name: Publish GitHub Release

    if: ${{ inputs.publish_release }}

    needs:
      - validate
      - windows
      - linux
      - macos-universal

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      - name: Download release ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          echo "Files being published:"
          find release-assets -maxdepth 1 -type f -print

      - name: Verify all three ZIPs exist
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          WINDOWS="release-assets/ExtinctionDefense-v${VERSION}-Windows-x64.zip"
          LINUX="release-assets/ExtinctionDefense-v${VERSION}-Linux-x64.zip"
          MACOS="release-assets/ExtinctionDefense-v${VERSION}-macOS-Universal.zip"

          for FILE in "$WINDOWS" "$LINUX" "$MACOS"; do
              if [[ ! -f "$FILE" ]]; then
                  echo "Missing release file: $FILE"
                  exit 1
              fi
          done

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create \
              "v${VERSION}" \
              release-assets/*.zip \
              --repo "$REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "Extinction Defense v${VERSION}" \
              --generate-notes
